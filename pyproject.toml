[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "telemetry-leak-lab"
version = "0.1.0"
description = "Reproducible synthetic security experiments by Ixequi Luna"
requires-python = ">=3.11"
authors = [{name = "Dr. Ixequi Luna"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = []
[project.scripts]
telemetry-leak-lab = "telemetry_leak_lab.__main__:main"
[tool.setuptools.packages.find]
include = ["telemetry_leak_lab*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
